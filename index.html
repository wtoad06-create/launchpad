<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>launchpad</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
<style>
  :root{
    --bg:#0a0a0a; --panel:#141414; --border:#262626; --text:#f2f2f2; --muted:#8a8a8a;
    --accent:#7c5cff; --green:#3ddc84; --red:#ff5c5c;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;padding:0;}
  header{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;border-bottom:1px solid var(--border);}
  header h1{font-size:18px;margin:0;letter-spacing:.5px;}
  header h1 span{color:var(--accent);}
  button{cursor:pointer;border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;}
  .btn-primary{background:var(--accent);color:white;}
  .btn-secondary{background:var(--panel);color:var(--text);border:1px solid var(--border);}
  .btn-green{background:var(--green);color:#04210f;}
  .btn-red{background:var(--red);color:#2a0000;}
  main{max-width:960px;margin:0 auto;padding:28px;}
  .tabs{display:flex;gap:8px;margin-bottom:20px;}
  .tab{padding:8px 14px;border-radius:8px;color:var(--muted);cursor:pointer;font-size:14px;}
  .tab.active{background:var(--panel);color:var(--text);border:1px solid var(--border);}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px;}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .muted{color:var(--muted);font-size:13px;}
  input{width:100%;background:#0f0f0f;border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;margin-top:6px;font-size:14px;}
  label{font-size:13px;color:var(--muted);display:block;margin-top:12px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  #status{font-size:13px;color:var(--muted);margin-top:10px;min-height:18px;}
  .pill{font-size:11px;padding:3px 8px;border-radius:20px;background:#1f1f1f;color:var(--muted);}
  .pill.graduated{background:#0f2e1c;color:var(--green);}
  a{color:var(--accent);text-decoration:none;}
</style>
</head>
<body>

<header>
  <h1>launch<span>pad</span></h1>
  <button id="connectBtn" class="btn-primary">Connect Wallet</button>
</header>

<main>
  <div class="tabs">
    <div class="tab active" data-tab="explore">Explore</div>
    <div class="tab" data-tab="create">Create</div>
  </div>

  <div id="explore">
    <div class="row" style="margin-bottom:12px;">
      <div class="muted">Contract: <span id="contractAddrLabel">not configured</span></div>
      <button class="btn-secondary" id="refreshBtn">Refresh</button>
    </div>
    <div id="tokenList"></div>
  </div>

  <div id="create" style="display:none;">
    <div class="card">
      <h3 style="margin-top:0;">Launch a fixed-supply token</h3>
      <label>Name</label>
      <input id="c_name" placeholder="My Token" />
      <label>Symbol</label>
      <input id="c_symbol" placeholder="MTK" />
      <div class="grid2">
        <div>
          <label>Total Supply</label>
          <input id="c_total" placeholder="1000000" />
        </div>
        <div>
          <label>Curve Supply (sold via bonding curve)</label>
          <input id="c_curve" placeholder="800000" />
        </div>
      </div>
      <div class="grid2">
        <div>
          <label>Base Price (wei per token)</label>
          <input id="c_base" placeholder="1000000000000" />
        </div>
        <div>
          <label>Slope (wei increase per token sold)</label>
          <input id="c_slope" placeholder="1000" />
        </div>
      </div>
      <button class="btn-primary" style="margin-top:16px;width:100%;" id="createBtn">Deploy Token</button>
      <div id="createStatus" class="muted" style="margin-top:8px;"></div>
    </div>
  </div>

  <div id="status"></div>
</main>
